app = "findmyforce-jefferson"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  API_URL = "http://127.0.0.1:5051"
  API_KEY = "local-simulator"
  SIM_PORT = "5051"
  EMITTERS = "8"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Kept warm deliberately. Starting Python, importing torch, loading the model and
  # generating a scenario on one shared core takes 20-50s from cold, and varies too
  # much between runs to design around. Idling costs a few dollars a month; a
  # visitor meeting a 40-second blank page costs more.
  [[http_service.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
