app = "findmyforce-jefferson"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  API_URL = "http://127.0.0.1:5051"
  API_KEY = "local-simulator"
  SIM_PORT = "5051"
  EMITTERS = "8"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # The pipeline classifies continuously while the machine is up, so leaving it
  # running costs CPU with nobody watching. Startup pre-rolls the scenario, which
  # puts a populated map on screen about 13s after a cold boot - short enough to
  # let the machine stop when idle instead.
  [[http_service.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
