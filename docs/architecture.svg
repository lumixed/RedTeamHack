<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00ffd0"/>
    </marker>
  </defs>

  <rect width="1040" height="720" fill="#080b11"/>

  <text x="30" y="38" fill="#e6edf3" font-size="19" font-weight="700" letter-spacing="2">FIND MY FORCE</text>
  <text x="215" y="38" fill="#4a5568" font-size="13" letter-spacing="1">RF COMMON OPERATING PICTURE</text>
  <line x1="30" y1="52" x2="1010" y2="52" stroke="#1c2430"/>

  <!-- SIMULATOR -->
  <rect x="30" y="72" width="980" height="118" rx="6" fill="#0d1420" stroke="#1f3d3a"/>
  <text x="48" y="96" fill="#00ffd0" font-size="12" font-weight="700" letter-spacing="2">SIMULATED RF RANGE</text>
  <text x="240" y="96" fill="#3d4b5c" font-size="11">simulator/</text>

  <rect x="48" y="110" width="210" height="62" rx="4" fill="#111a26" stroke="#243449"/>
  <text x="62" y="132" fill="#c9d6e3" font-size="12" font-weight="700">signals.py</text>
  <text x="62" y="150" fill="#6b7c91" font-size="10">8 emitter types, per-modulation</text>
  <text x="62" y="164" fill="#6b7c91" font-size="10">256-sample IQ (128 I + 128 Q)</text>

  <rect x="286" y="110" width="210" height="62" rx="4" fill="#111a26" stroke="#243449"/>
  <text x="300" y="132" fill="#c9d6e3" font-size="12" font-weight="700">scenario.py</text>
  <text x="300" y="150" fill="#6b7c91" font-size="10">5 receivers, moving emitters</text>
  <text x="300" y="164" fill="#6b7c91" font-size="10">path-loss RSSI + true ToA</text>

  <rect x="524" y="110" width="210" height="62" rx="4" fill="#111a26" stroke="#243449"/>
  <text x="538" y="132" fill="#c9d6e3" font-size="12" font-weight="700">api.py</text>
  <text x="538" y="150" fill="#6b7c91" font-size="10">SSE feed, config, scoring</text>
  <text x="538" y="164" fill="#6b7c91" font-size="10">knows ground truth</text>

  <rect x="762" y="110" width="230" height="62" rx="4" fill="#0f1a17" stroke="#1f3d3a"/>
  <text x="776" y="132" fill="#00ffd0" font-size="11" font-weight="700">make_dataset.py</text>
  <text x="776" y="150" fill="#6b7c91" font-size="10">friendly-only HDF5 training set</text>
  <text x="776" y="164" fill="#6b7c91" font-size="10">SNR 6-27 dB</text>

  <line x1="520" y1="190" x2="520" y2="232" stroke="#00ffd0" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="534" y="216" fill="#00ffd0" font-size="10">observations: IQ + RSSI + SNR + time-of-arrival</text>

  <!-- PIPELINE -->
  <rect x="30" y="236" width="980" height="282" rx="6" fill="#0d1420" stroke="#243449"/>
  <text x="48" y="260" fill="#7aa2f7" font-size="12" font-weight="700" letter-spacing="2">PROCESSING PIPELINE</text>
  <text x="240" y="260" fill="#3d4b5c" font-size="11">pipeline/ + classifier/</text>

  <rect x="48" y="276" width="200" height="136" rx="4" fill="#111a26" stroke="#243449"/>
  <text x="62" y="298" fill="#c9d6e3" font-size="12" font-weight="700">classify</text>
  <text x="62" y="320" fill="#6b7c91" font-size="10">86 expert features</text>
  <text x="62" y="335" fill="#6b7c91" font-size="10">+ 128 latent (1D-CNN)</text>
  <text x="62" y="354" fill="#6b7c91" font-size="10">HistGB + MLP ensemble</text>
  <text x="62" y="373" fill="#ff9f0a" font-size="10">one-class SVM: novel?</text>
  <text x="62" y="388" fill="#6b7c91" font-size="10">physics rules to type</text>
  <text x="62" y="404" fill="#3d4b5c" font-size="9">trained offline, see make_dataset</text>

  <rect x="268" y="276" width="200" height="136" rx="4" fill="#111a26" stroke="#243449"/>
  <text x="282" y="298" fill="#c9d6e3" font-size="12" font-weight="700">associate</text>
  <text x="282" y="320" fill="#6b7c91" font-size="10">group the receivers that</text>
  <text x="282" y="335" fill="#6b7c91" font-size="10">heard one emission, by:</text>
  <text x="282" y="354" fill="#6b7c91" font-size="10">time window</text>
  <text x="282" y="369" fill="#6b7c91" font-size="10">agreeing label</text>
  <text x="282" y="384" fill="#6b7c91" font-size="10">IQ envelope similarity</text>

  <rect x="488" y="276" width="200" height="136" rx="4" fill="#111a26" stroke="#243449"/>
  <text x="502" y="298" fill="#c9d6e3" font-size="12" font-weight="700">geolocate</text>
  <text x="502" y="320" fill="#6b7c91" font-size="10">RSSI trilateration</text>
  <text x="502" y="335" fill="#6b7c91" font-size="10">TDoA multilateration</text>
  <text x="502" y="354" fill="#6b7c91" font-size="10">inverse-variance fusion</text>
  <text x="502" y="369" fill="#6b7c91" font-size="10">GDOP estimate</text>
  <text x="502" y="388" fill="#00ffd0" font-size="10">12 m median error</text>

  <rect x="708" y="276" width="200" height="136" rx="4" fill="#111a26" stroke="#243449"/>
  <text x="722" y="298" fill="#c9d6e3" font-size="12" font-weight="700">track</text>
  <text x="722" y="320" fill="#6b7c91" font-size="10">velocity-aided gating</text>
  <text x="722" y="335" fill="#6b7c91" font-size="10">Kalman smoothing</text>
  <text x="722" y="354" fill="#6b7c91" font-size="10">TENTATIVE</text>
  <text x="722" y="369" fill="#6b7c91" font-size="10">CONFIRMED</text>
  <text x="722" y="384" fill="#6b7c91" font-size="10">COASTING / LOST</text>

  <line x1="248" y1="344" x2="266" y2="344" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="468" y1="344" x2="486" y2="344" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="688" y1="344" x2="706" y2="344" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="48" y="428" width="420" height="72" rx="4" fill="#0f1620" stroke="#1c2836"/>
  <text x="62" y="450" fill="#8b9bb0" font-size="11" font-weight="700">feed_consumer.py</text>
  <text x="62" y="470" fill="#6b7c91" font-size="10">consumes the SSE stream, drives the four stages,</text>
  <text x="62" y="486" fill="#6b7c91" font-size="10">and submits classifications back for scoring</text>

  <rect x="488" y="428" width="420" height="72" rx="4" fill="#0f1620" stroke="#1c2836"/>
  <text x="502" y="450" fill="#8b9bb0" font-size="11" font-weight="700">eval_runner.py</text>
  <text x="502" y="470" fill="#6b7c91" font-size="10">batch path: classify the held-out set, group by emitter,</text>
  <text x="502" y="486" fill="#6b7c91" font-size="10">geolocate, submit for an official score</text>

  <line x1="520" y1="518" x2="520" y2="560" stroke="#00ffd0" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="534" y="544" fill="#00ffd0" font-size="10">Socket.IO track updates</text>

  <!-- DASHBOARD -->
  <rect x="30" y="564" width="980" height="122" rx="6" fill="#0d1420" stroke="#1f3d3a"/>
  <text x="48" y="588" fill="#00ffd0" font-size="12" font-weight="700" letter-spacing="2">COMMON OPERATING PICTURE</text>
  <text x="290" y="588" fill="#3d4b5c" font-size="11">dashboard/ + server.py</text>

  <rect x="48" y="602" width="220" height="66" rx="4" fill="#111a26" stroke="#243449"/>
  <text x="62" y="624" fill="#c9d6e3" font-size="12" font-weight="700">Leaflet map</text>
  <text x="62" y="642" fill="#6b7c91" font-size="10">tracks, trails, uncertainty</text>
  <text x="62" y="657" fill="#6b7c91" font-size="10">rings, receiver stations</text>

  <rect x="288" y="602" width="220" height="66" rx="4" fill="#111a26" stroke="#243449"/>
  <text x="302" y="624" fill="#c9d6e3" font-size="12" font-weight="700">tactical HUD</text>
  <text x="302" y="642" fill="#6b7c91" font-size="10">filters, track detail,</text>
  <text x="302" y="657" fill="#6b7c91" font-size="10">live observation feed</text>

  <rect x="528" y="602" width="220" height="66" rx="4" fill="#111a26" stroke="#243449"/>
  <text x="542" y="624" fill="#c9d6e3" font-size="12" font-weight="700">Flask + Socket.IO</text>
  <text x="542" y="642" fill="#6b7c91" font-size="10">REST status and tracks,</text>
  <text x="542" y="657" fill="#6b7c91" font-size="10">push updates to clients</text>

  <rect x="768" y="602" width="224" height="66" rx="4" fill="#111a26" stroke="#243449"/>
  <text x="782" y="624" fill="#c9d6e3" font-size="12" font-weight="700">affiliation colouring</text>
  <text x="782" y="644" fill="#00ffd0" font-size="10">friendly</text>
  <text x="852" y="644" fill="#ff2d55" font-size="10">hostile</text>
  <text x="782" y="659" fill="#5856d6" font-size="10">civilian</text>
  <text x="852" y="659" fill="#ff9f0a" font-size="10">unknown</text>
</svg>
